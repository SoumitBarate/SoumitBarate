name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#4A6FA5&color_dots=#161b22,#0B1F3A,#1E3A5F,#2E4A6B,#4A6FA5
            dist/snake-light.svg?color_snake=#0B1F3A&color_dots=#ebedf0,#C9D6E8,#8FA8CC,#4A6FA5,#0B1F3A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
